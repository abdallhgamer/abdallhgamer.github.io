* {

:root {

    --pink: #ff3cac;

body {

}

}

.header-btn {

}

.hero {

.hero h1 {

}

.hero p {

}

    color: #c5c9df;

    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
}

.nav button.active,
.nav button:hover {
    background: linear-gradient(135deg,#7c5cff,#5540d8);

.container {
    max-width: 1100px;
    padding: 15px;
    margin: auto;
}

    gap: 10px;
}

    content: "";

    height: 25px;
    border-radius: 5px;
    background: linear-gradient(#20d9ff,#7c5cff,#ff3cac);
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
    gap: 16px;
}

.card {
    background: linear-gradient(145deg,#191b35,#0d1020);

    border-radius: 20px;
    padding: 17px;
    display: flex;
    gap: 13px;
    align-items: center;
    transition: .3s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #7c5cff;
    box-shadow: 0 10px 35px #7c5cff25;
}

    align-items: center;

    font-size: 27px;
    flex-shrink: 0;
    overflow: hidden;
}

.icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.details {
    flex: 1;
    min-width: 0;
}

    font-size: 15px;
    margin-bottom: 5px;
}

    font-size: 12px;
    margin-bottom: 10px;
}
