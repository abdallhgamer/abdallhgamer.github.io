<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdallah Cloud</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e1c;color:white;font-family:Tahoma}
header{background:#111d33;padding:25px;text-align:center}
header h1{color:#35a5ff;margin:0}
header p{color:#9aabc5}
main{max-width:800px;margin:30px auto;padding:15px}
.box{background:#111d33;padding:22px;border:1px solid #2a3c5c;border-radius:15px}
label{display:block;margin:18px 0 9px}
input,textarea{width:100%;padding:14px;background:#080f20;color:white;border:1px solid #344968;border-radius:9px;font-family:Tahoma}
textarea{height:250px;direction:ltr;text-align:left}
button{width:100%;padding:15px;margin-top:15px;border:0;border-radius:9px;background:#168cff;color:white;font-size:16px;cursor:pointer}
button.secondary{background:#263c5e}
iframe{width:100%;height:300px;background:white;border:0;margin-top:15px;border-radius:9px}
#status{color:#ffd166;text-align:center;margin-top:15px}
</style>
</head>
<body>
<header>
<h1>☁ ABDALLAH CLOUD</h1>
<p>HTML Website Builder</p>
</header>
<main>
<div class="box">
<h2>ساخت صفحه HTML</h2>

<label>نام صفحه</label>
<input id="name" placeholder="مثلاً game">

<label>کد HTML</label>
<textarea id="code" placeholder="کد HTML خود را وارد کنید..."></textarea>

<button class="secondary" onclick="preview()">پیش‌نمایش سایت</button>
<iframe id="preview" sandbox="allow-scripts" style="display:none"></iframe>

<button onclick="downloadPage()">ساخت فایل HTML</button>
<p id="status"></p>
</div>
</main>

<script>
function preview(){
 const code=document.getElementById("code").value;
 if(!code.trim()){
  status("ابتدا کد HTML را وارد کن.");
  return;
 }
 const frame=document.getElementById("preview");
 frame.srcdoc=code;
 frame.style.display="block";
}

function status(message){
 document.getElementById("status").textContent=message;
}

function downloadPage(){
 const name=document.getElementById("name").value.trim();
 const code=document.getElementById("code").value;

 if(!/^[a-zA-Z0-9_-]{1,40}$/.test(name)){
  status("نام انگلیسی معتبر وارد کن.");
  return;
 }
 if(!code.trim()){
  status("کد HTML را وارد کن.");
  return;
 }

 const blob=new Blob([code],{type:"text/html;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=name+".html";
 a.click();
 URL.revokeObjectURL(url);
 status("فایل "+name+".html ساخته شد. برای انتشار، آن را در پوشه cloud مخزن GitHub قرار بده.");
}
</script>
</body>
</html>
