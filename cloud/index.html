<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abdallah Cloud</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;font-family:Tahoma;color:#25262b}
header{background:white;padding:23px 7%;border-bottom:1px solid #eee;font-size:21px;font-weight:bold;direction:ltr}
main{max-width:850px;margin:35px auto;padding:15px}
h1{font-size:25px}
.desc{color:#888;font-size:13px}
.card{background:white;border:1px solid #eee;border-radius:16px;padding:22px;margin-top:20px}
input,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;margin:10px 0;font-family:monospace}
textarea{height:280px;direction:ltr;text-align:left}
button{border:0;background:#25262b;color:white;padding:13px 20px;border-radius:10px;cursor:pointer;font-family:Tahoma}
button.light{background:#eee;color:#222}
iframe{width:100%;height:300px;border:1px solid #ddd;border-radius:10px;background:white}
#result{display:none}
.link{direction:ltr;background:#f1f2f4;padding:14px;border-radius:9px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>Abdallah Cloud ☁️</header>
<main>
<h1>ساخت سایت HTML</h1>
<p class="desc">کد HTML خودت را بنویس و سایتت را بساز.</p>

<div class="card">
<label>نام سایت</label>
<input id="name" placeholder="مثلاً neme">

<label>کد HTML</label>
<textarea id="code" spellcheck="false"><!DOCTYPE html>
<html>
<head>
<title>My Website</title>
</head>
<body>
<h1>سلام دنیا!</h1>
<p>سایت من با Abdallah Cloud ساخته شد.</p>
</body>
</html></textarea>

<button onclick="preview()">پیش‌نمایش</button>
<button onclick="createSite()">ساخت سایت</button>
<p id="status" class="desc"></p>
</div>

<div class="card">
<h3>پیش‌نمایش</h3>
<iframe id="frame" sandbox=""></iframe>
</div>

<div class="card" id="result">
<h3>سایت شما ساخته شد!</h3>
<div class="link" id="url"></div>
<br><br>
<button onclick="copyURL()">کپی لینک</button>
<button class="light" onclick="downloadSite()">دانلود HTML</button>
</div>
</main>

<script>
let output="";

function preview(){
 document.getElementById("frame").srcdoc=
 document.getElementById("code").value;
}

function createSite(){
 const name=document.getElementById("name").value.trim();
 const code=document.getElementById("code").value;

 if(!/^[a-zA-Z0-9_-]{1,40}$/.test(name)){
  alert("نام سایت را با حروف انگلیسی وارد کن.");
  return;
 }

 if(!code.trim()){
  alert("کد HTML را وارد کن.");
  return;
 }

 output=code;

 const blob=new Blob([code],{type:"text/html"});
 const downloadURL=URL.createObjectURL(blob);

 document.getElementById("url").textContent=
 "فایل آماده است: "+name+".html";

 document.getElementById("result").style.display="block";
 document.getElementById("status").textContent=
 "فایل HTML ساخته شد. برای انتشار آنلاین آن را در پوشه cloud مخزن GitHub قرار بده.";

 const a=document.createElement("a");
 a.href=downloadURL;
 a.download=name+".html";
 a.click();

 setTimeout(()=>URL.revokeObjectURL(downloadURL),10000);
}

function copyURL(){
 const text=document.getElementById("url").textContent;
 navigator.clipboard.writeText(text).then(()=>alert("متن کپی شد."));
}

function downloadSite(){
 if(!output)return;
 const blob=new Blob([output],{type:"text/html"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=document.getElementById("name").value+".html";
 a.click();
}
preview();
</script>
</body>
</html>
