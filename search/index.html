<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سرچ عبدالله گیمر</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial;
background:#fff;
color:#202124;
}
header{
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
}
.brand{
font-size:17px;
font-weight:bold;
color:#4285f4;
}
.top{
color:#555;
font-size:13px;
}
main{
min-height:75vh;
display:flex;
align-items:center;
flex-direction:column;
justify-content:center;
padding:20px;
}
.logo{
font-size:clamp(35px,8vw,65px);
font-weight:bold;
letter-spacing:-3px;
margin-bottom:12px;
}
.logo span:nth-child(1){color:#4285f4}
.logo span:nth-child(2){color:#ea4335}
.logo span:nth-child(3){color:#fbbc05}
.logo span:nth-child(4){color:#4285f4}
.logo span:nth-child(5){color:#34a853}
.logo span:nth-child(6){color:#ea4335}
.subtitle{
font-size:13px;
color:#777;
margin-bottom:30px;
}
.search{
width:100%;
max-width:620px;
height:55px;
border:1px solid #dfe1e5;
border-radius:30px;
display:flex;
align-items:center;
padding:0 18px;
box-shadow:0 2px 7px #00000012;
}
.search:hover,.search:focus-within{
box-shadow:0 2px 10px #00000025;
}
.search input{
flex:1;
min-width:0;
border:0;
outline:0;
font-size:16px;
padding:10px;
background:transparent;
}
.search button{
border:0;
background:none;
font-size:21px;
cursor:pointer;
}
.buttons{
display:flex;
gap:12px;
margin-top:25px;
flex-wrap:wrap;
justify-content:center;
}
.buttons button{
background:#f8f9fa;
border:1px solid #f8f9fa;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
color:#333;
font-family:Tahoma;
}
.buttons button:hover{
border-color:#dadce0;
}
.shortcuts{
width:100%;
max-width:650px;
margin-top:55px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}
.shortcut{
text-decoration:none;
color:#444;
display:flex;
align-items:center;
flex-direction:column;
gap:10px;
font-size:12px;
padding:15px 5px;
border-radius:12px;
}
.shortcut:hover{background:#f1f3f4}
.icon{
width:43px;
height:43px;
border-radius:50%;
background:#f1f3f4;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}
footer{
background:#f2f2f2;
padding:22px;
text-align:center;
font-size:12px;
color:#777;
}
@media(max-width:450px){
.shortcuts{grid-template-columns:repeat(3,1fr)}
.logo{letter-spacing:-2px}
}
</style>
</head>

<body>

<header>
<div class="brand">🎮 ABDULLAH GAMER</div>
<div class="top">جستجوگر اینترنتی</div>
</header>

<main>

<div class="logo">
<span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
</div>

<div class="subtitle">خوش آمدید به سرچ عبدالله گیمر</div>

<form class="search" id="searchForm">
<button type="submit">🔍</button>
<input id="query" type="search"
placeholder="در اینترنت جستجو کنید..."
autocomplete="off" required>
</form>

<div class="buttons">
<button onclick="searchGoogle()">جستجوی گوگل</button>
<button onclick="searchImages()">جستجوی تصاویر</button>
<button onclick="searchVideos()">جستجوی ویدئو</button>
</div>

<div class="shortcuts">

<a class="shortcut" href="https://www.youtube.com">
<div class="icon">▶️</div>یوتیوب
</a>

<a class="shortcut" href="https://www.aparat.com">
<div class="icon">📺</div>آپارات
</a>

<a class="shortcut" href="https://github.com">
<div class="icon">💻</div>گیت‌هاب
</a>

<a class="shortcut" href="https://rubika.ir">
<div class="icon">💬</div>روبیکا
</a>

<a class="shortcut" href="https://www.wikipedia.org">
<div class="icon">📚</div>ویکی‌پدیا
</a>

<a class="shortcut" href="https://www.digikala.com">
<div class="icon">🛒</div>دیجی‌کالا
</a>

<a class="shortcut" href="https://www.instagram.com">
<div class="icon">📷</div>اینستاگرام
</a>

<a class="shortcut" href="https://www.bing.com">
<div class="icon">🌐</div>بینگ
</a>

</div>
</main>

<footer>
ساخته شده توسط عبدالله ظاهری ❤️
<br><br>
© 2026 Abdullah Gamer Search
</footer>

<script>
const input=document.getElementById("query");

function searchGoogle(){
let q=input.value.trim();
if(q) location.href="https://www.google.com/search?q="+encodeURIComponent(q);
}

function searchImages(){
let q=input.value.trim();
if(q) location.href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(q);
}

function searchVideos(){
let q=input.value.trim();
if(q) location.href="https://www.google.com/search?tbm=vid&q="+encodeURIComponent(q);
}

document.getElementById("searchForm").addEventListener("submit",function(e){
e.preventDefault();
searchGoogle();
});
</script>

</body>
</html>
