<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عبدالله گیمر مسنجر</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:tahoma}
header{background:#17243a;padding:18px;text-align:center;font-size:21px;font-weight:bold}
.container{max-width:650px;margin:25px auto;padding:15px}
.box{background:#1b2a42;padding:20px;border-radius:15px;margin-bottom:15px}
input,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:9px;font-size:15px}
input{background:#293b55;color:white}
button{background:#16a878;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#10865f}
#chat{display:none}
#messages{height:350px;overflow:auto;background:#111d30;padding:12px;border-radius:12px}
.msg{background:#263c59;padding:10px;margin:8px 0;border-radius:10px;overflow-wrap:anywhere}
.mine{background:#087d61}
.small{color:#a9bad0;font-size:12px;text-align:center}
</style>
</head>
<body>
<header>💬 عبدالله گیمر مسنجر</header>

<div class="container">
  <div class="box" id="login">
    <h3>ورود به پیام‌رسان</h3>
    <input id="username" placeholder="نام کاربری">
    <input id="password" type="password" placeholder="رمز عبور">
    <button onclick="account('login')">ورود</button>
    <button onclick="account('register')">ساخت حساب</button>
    <p class="small" id="status">برای ورود یا ثبت‌نام اقدام کن.</p>
  </div>

  <div class="box" id="chat">
    <h3 id="welcome"></h3>
    <input id="receiver" placeholder="نام کاربری گیرنده">
    <div id="messages"></div>
    <input id="message" placeholder="پیام خود را بنویس...">
    <button onclick="sendMessage()">ارسال پیام</button>
    <button onclick="loadMessages()">بروزرسانی پیام‌ها</button>
    <button onclick="logout()" style="background:#a83b48">خروج</button>
    <p class="small" id="chatStatus"></p>
  </div>
</div>

<script>
const API = "https://abdallah-cloud.azahry156.workers.dev";

let token = "";
let currentUser = "";

async function request(path, method="GET", data=null) {
  const headers = {"Content-Type":"application/json"};
  if(token) headers.Authorization = "Bearer " + token;

  const response = await fetch(API + path, {
    method,
    headers,
    body: data ? JSON.stringify(data) : null
  });

  const result = await response.json();
  if(!response.ok) throw new Error(result.error || "خطا در ارتباط با سرور");
  return result;
}

async function account(type) {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const status = document.getElementById("status");

  if(!username || !password) {
    status.textContent = "نام کاربری و رمز عبور را وارد کن.";
    return;
  }

  status.textContent = "در حال اتصال به سرور...";

  try {
    const result = await request(
      "/api/" + type,
      "POST",
      {username, password}
    );

    token = result.token;
    currentUser = result.username || username;

    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "block";
    document.getElementById("welcome").textContent =
      "سلام " + currentUser + " 👋";

    loadMessages();
  } catch(error) {
    status.textContent = error.message;
  }
}

async function sendMessage() {
  const to = document.getElementById("receiver").value.trim();
  const message = document.getElementById("message").value.trim();

  if(!to || !message) {
    document.getElementById("chatStatus").textContent =
      "نام گیرنده و متن پیام را وارد کن.";
    return;
  }

  try {
    await request("/api/messages", "POST", {to, message});
    document.getElementById("message").value = "";
    document.getElementById("chatStatus").textContent = "پیام ارسال شد.";
    loadMessages();
  } catch(error) {
    document.getElementById("chatStatus").textContent = error.message;
  }
}

async function loadMessages() {
  const to = document.getElementById("receiver").value.trim();
  if(!to) {
    document.getElementById("chatStatus").textContent =
      "ابتدا نام کاربری گیرنده را وارد کن.";
    return;
  }

  try {
    const result = await request(
      "/api/messages?with=" + encodeURIComponent(to)
    );

    const area = document.getElementById("messages");
    area.innerHTML = "";

    (result.messages || []).forEach(item => {
      const div = document.createElement("div");
      div.className = "msg" +
        (item.from === currentUser ? " mine" : "");
      div.textContent = item.from + ": " + item.message;
      area.appendChild(div);
    });

    area.scrollTop = area.scrollHeight;
  } catch(error) {
    document.getElementById("chatStatus").textContent = error.message;
  }
}

function logout() {
  token = "";
  currentUser = "";
  document.getElementById("chat").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("password").value = "";
}
</script>
</body>
</html>
